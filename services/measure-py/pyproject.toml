[project]
name = "mynted-measure"
version = "0.1.0"
description = "MyntedScan Python reference centering pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "pillow>=10.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]