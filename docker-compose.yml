services:
  postgres:
    image: postgres:16
    container_name: mynted-scan-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mynted
      POSTGRES_PASSWORD: mynted
      POSTGRES_DB: centering
    volumes:
      - mynted_scan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mynted -d centering"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mynted_scan_pg: